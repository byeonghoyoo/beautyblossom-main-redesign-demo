name: Board image variants (720px WebP)

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 새 게시판/팝업 이미지의 경량판 생성
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write

concurrency:
  group: board-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Create missing variants
        run: python -I scripts/sync-board-images.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- assets/opt && [ -z "$(git ls-files --others --exclude-standard assets/opt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/opt
            git commit -m "Add 720px WebP variants for new board images"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
