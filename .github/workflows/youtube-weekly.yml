name: YouTube long-form weekly update

on:
  schedule:
    - cron: '0 23 * * 0'   # 매주 월요일 08:00 KST (일요일 23:00 UTC)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write

concurrency:
  group: youtube-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch long-form list
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-youtube.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/youtube-longform.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/youtube-longform.json
            git commit -m "Update YouTube long-form list"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
